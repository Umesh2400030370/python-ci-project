
name: Python CI

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install tools
        run: python -m pip install ruff

      - name: Lint code
        run: python -m ruff check calculator.py test_calculator.py

      - name: Run unit tests
        run: python -m unittest discover -s . -p "test_*.py" -v
